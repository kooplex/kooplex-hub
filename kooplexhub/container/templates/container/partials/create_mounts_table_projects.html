<div class="table-responsive create-volume-table-wrap">
  <table class="table table-sm table-hover align-middle mb-0">
    <thead>
      <tr>
        <th style="width: 5rem;">Attach</th>
        <th>Project</th>
        <th>Collaborators</th>
      </tr>
    </thead>

    <tbody>
      {% for project in projects %}
        <tr>
          <td>
            <input
              class="mount-toggle"
              type="checkbox"
              name="project_ids"
              value="{{ project.id }}"
              id="mount-project-{{ project.id }}"
              {% if project.id in selected_project_ids %}checked{% endif %}
            >
          </td>

          <td>
            <span class="mount-path-info" tabindex="0" title="{{ project.mount_tooltip }}" aria-label="Mount details: {{ project.mount_tooltip }}">
              <i class="bi bi-info-circle" aria-hidden="true"></i>
            </span>
            <label for="mount-project-{{ project.id }}" class="mb-0">
              {{ project.name }}
            </label>
          </td>

          <td class="mount-team-cell">
            {% if project.mount_members %}
              <div class="mount-team-list" title="{{ project.mount_team_tooltip }}" tabindex="0" aria-label="Collaborators: {{ project.mount_team_tooltip }}">
                {% for member in project.mount_members %}
                  <span class="mount-team-member">
                    <span class="mount-team-name">{{ member.user.get_full_name|default:member.user.username }}</span>
                    <span class="mount-team-role" title="{{ member.role_label }}" aria-label="{{ member.role_label }}">
                      <i class="bi {{ member.role_icon }}" aria-hidden="true"></i>
                    </span>
                  </span>
                {% endfor %}
              </div>
            {% else %}
              <span class="text-muted small">No collaborators</span>
            {% endif %}
          </td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="3" class="text-muted">
            No attachable projects.
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
