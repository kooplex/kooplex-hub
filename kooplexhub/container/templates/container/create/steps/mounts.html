<div class="mb-4">
  <div class="d-flex justify-content-between">
    <div>
      <h6 class="mb-1">
        Mounts
      </h6>

      <p class="text-muted small mb-3">
        Optionally attach projects, courses,
        or storage volumes.
      </p>
    </div>

    <span class="badge text-bg-light align-self-start">
      Optional
    </span>
  </div>

  <div id="container-create-mounts-slot">
    {% if selected_projects or selected_courses or selected_volumes %}
      {% include "container/partials/create_mounts_selected.html" %}
    {% else %}
      {% include "container/partials/create_mounts_empty.html" %}
    {% endif %}
  </div>

  <div
    id="container-create-mount-picker"
    class="mt-3"
  ></div>
</div>
