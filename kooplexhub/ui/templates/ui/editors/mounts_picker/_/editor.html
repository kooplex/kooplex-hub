<div
    id="{{ editor.dom_id }}-mounts"
    data-mounts-list
>
    {% for volume in editor.selected_mounts %}
        {% include "ui/editors/mounts_picker/row.html" with volume=volume only %}
    {% empty %}
        <p
            class="text-muted"
            data-mounts-empty
        >
            No storage volumes selected.
        </p>
    {% endfor %}
</div>
