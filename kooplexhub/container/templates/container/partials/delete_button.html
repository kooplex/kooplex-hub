  class="badge rounded-pill text-bg-danger border p-2"
  data-bs-toggle="tooltip"
  title="Remove environment {{ container.name }}"
  hx-get="{% url 'container:destroy' container.pk %}"
  hx-target="#modal-root"
  hx-swap="innerHTML"
>
  <i class="bi bi-trash" aria-hidden="true"></i>
</button>
