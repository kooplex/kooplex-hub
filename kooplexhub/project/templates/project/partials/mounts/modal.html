<div
  id="projectMountsModal"
  class="modal fade"
  tabindex="-1"
  aria-hidden="true"
  data-auto-show-modal
>
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <form
      class="modal-content"
      hx-post="{% url 'project:mounts_save' project.pk %}"
      hx-target="#card-project-{{ project.pk }}"
      hx-swap="outerHTML"
    >
      {% csrf_token %}

      <div class="modal-header">
        <h5 class="modal-title">
          Configure mounts
        </h5>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>

      <div class="modal-body">
        <p class="text-muted small">
          Select storage volumes preferably attached to this project.
        </p>

        {% include "project/partials/mounts/picker.html" %}
      </div>

      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-outline-secondary"
          data-bs-dismiss="modal"
        >
          Cancel
        </button>

        <button type="submit" class="btn btn-primary">
          Save mounts
        </button>
      </div>
    </form>
  </div>
</div>
