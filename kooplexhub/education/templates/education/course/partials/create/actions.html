<div class="modal-footer course-create-wizard__actions" data-wizard-actions>
    <button type="button" class="btn btn-outline-secondary me-auto" data-bs-dismiss="modal">
        Cancel
    </button>

    <button type="button" class="btn btn-outline-secondary" data-wizard-previous hidden>
        Previous
    </button>

    <button type="button" class="btn btn-primary" data-wizard-next>
        Next
    </button>

    <button type="submit" class="btn btn-primary" name="creation_mode" value="course" data-wizard-create hidden>
        Create course
    </button>

    <button type="submit" class="btn btn-success" name="creation_mode" value="course_and_environment" data-wizard-create-environment hidden>
        Create course and environment
    </button>
</div>
