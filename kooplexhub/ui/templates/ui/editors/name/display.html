<div id="{{ editor.dom_id }}" class="ui-name-editor">
    {% if editor.can_edit %}
        <button
            type="button"
            class="ui-name-editor__display btn border-0 bg-transparent p-0 text-start"
            hx-get="{{ editor.edit_url }}"
            hx-target="#{{ editor.dom_id }}"
            hx-swap="outerHTML"
	    aria-label="{{ editor.aria_label|default:'Edit name' }}"
        >
            {{ editor.value }}
        </button>
    {% else %}
        <span class="ui-name-editor__display">
            {{ editor.value }}
        </span>
    {% endif %}
</div>
