<div
  class="project-membership-controls"
  data-membership-controls
>
    <div class="mb-3">
        <label
            for="{{ editor.dom_id }}-search"
            class="form-label"
        >
            Add member
        </label>
    
        <input
            id="{{ editor.dom_id }}-search"
            type="search"
            name="q"
            class="form-control"
            placeholder="Search users, type at least two characters"
            autocomplete="off"
            hx-get="{{ editor.search_url }}"
            hx-trigger="input changed delay:300ms"
            hx-target="#{{ editor.dom_id }}-search-results"
            hx-swap="innerHTML"
            hx-include="closest form"
        >
    </div>
    
    {% if editor.import_url %}
    <div class="mb-2">
        <label for="{{ editor.dom_id }}-import" class="form-label small mb-1">
            Add members from text file (one username or email per line)
        </label>
        <input type="file" id="{{ editor.dom_id }}-import" name="members_file"
            class="form-control form-control-sm" accept=".txt,text/plain"
            hx-post="{{ editor.import_url }}" hx-trigger="change"
            hx-encoding="multipart/form-data" hx-include="closest form"
            hx-target="{{ membership_ui.members_target }}" hx-swap="beforeend">
        <div id="{{ membership_ui.dom_id }}-import-status" class="small mt-1" role="status"></div>
    </div>
    {% endif %}
    <div
        id="{{ editor.dom_id }}-search-results"
        class="membership-search-results"
    ></div>
    
    <div
        id="{{ membership_ui.dom_id }}-members"
        class="membership-selected-members"
        data-membership-selected-members
    >
        {% for member in editor.selected_members %}
            {% include "ui/editors/membership/row.html" with member=member membership_ui=membership_ui only %}
        {% empty %}
            {% if not editor.staged %}
              <p
                class="text-muted mb-0"
                data-membership-empty
              >
                No members selected.
              </p>
            {% endif %} 
        {% endfor %}
    </div>
</div>
