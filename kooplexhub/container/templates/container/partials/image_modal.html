<div
  class="modal fade"
  id="containerImageModal"
  tabindex="-1"
  aria-hidden="true"
  data-auto-show-modal
>
  <div class="modal-dialog modal-lg">
    <form
      class="modal-content"
      hx-post="{% url 'container:image_save' container.pk %}"
      hx-target="#card-container-{{ container.pk }}"
      hx-swap="outerHTML"
    >
      {% csrf_token %}

      <div class="modal-header">
        <h5 class="modal-title">Change base image</h5>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>

      <div class="modal-body">
	{% include "ui/editors/image_picker/editor.html" %}
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          Cancel
        </button>

        <button type="submit" class="btn btn-primary">
          Save image
        </button>
      </div>
    </form>
  </div>
</div>
