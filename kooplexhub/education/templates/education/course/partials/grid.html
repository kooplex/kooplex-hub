<div 
  id="listPane" 
  class="course-grid"
  hx-get="{% url 'education:course-grid' %}"
  hx-trigger="course-list-refresh from:body"
  hx-swap="outerHTML"
>
    {% for binding in coursebindings %}
        {% include "education/course/partials/card_wrapper.html" with binding=binding only %}
    {% empty %}
        {% include "empty.html" with empty_title="You have no courses yet." %}
    {% endfor %}
</div>
