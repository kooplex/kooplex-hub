<form
  method="post"
  hx-post="{{ editor.update_url }}"
  hx-target="this"
  hx-swap="outerHTML"
>
  {% csrf_token %}

  <div class="modal-body">
    {% include "ui/editors/mounts_picker/editor.html" with field=editor.form.mounts only %}
  </div>

  <div class="modal-footer">
    <button
      type="button"
      class="btn btn-outline-secondary"
      data-bs-dismiss="modal"
    >
      Cancel
    </button>

    <button type="submit" class="btn btn-primary">
      Save changes
    </button>
  </div>
</form>
