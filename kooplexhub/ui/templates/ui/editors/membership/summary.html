<div
    id="{{ editor.dom_id }}"
    class="project-membership-summary"
    hx-get="{{ editor.display_url }}"
    hx-trigger="{{ editor.refresh_event }} from:body"
    hx-target="this"
    hx-swap="outerHTML"
>
    <div class="project-membership-summary__members">
        {% for member in editor.members %}
	  <div class="project-member-badge">
            <span class="project-member-badge__name">
              {{ member.user.get_full_name|default:member.user.username }}
            </span>

            <span
              class="project-member-badge__role"
              aria-label="{{ member.role_label }}"
              title="{{ member.role_label }}"
            >
              <i
                class="bi {{ member.role_icon }}"
                aria-hidden="true"
              ></i>
            </span>
          </div>
        {% empty %}
          <span class="text-muted small">
              No collaborators
          </span>
        {% endfor %}
    </div>

    {% if editor.can_edit %}
        <button
            type="button"
            class="btn btn-sm btn-outline-secondary"
            hx-get="{{ editor.modal_url }}"
            hx-target="#modal-root"
            hx-swap="innerHTML"
        >
            <i class="bi bi-people"></i>
            Manage
        </button>
    {% endif %}
</div>
