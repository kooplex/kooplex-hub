<form
    id="{{ editor.dom_id }}"
    class="ui-name-editor"
    hx-post="{{ editor.update_url }}"
    hx-target="#{{ editor.dom_id }}"
    hx-swap="outerHTML"
>
    {% csrf_token %}

    <label
        for="{{ editor.field.id_for_label }}"
        class="visually-hidden"
    >
        {{ editor.field.label }}
    </label>

    <div class="ui-name-editor__row">
        <div class="ui-name-editor__field">
            {{ editor.field }}

            {% if editor.field.errors or editor.form.non_field_errors %}
                <div class="ui-name-editor__feedback" role="alert">
                    {% for error in editor.field.errors %}
                        <div>{{ error }}</div>
                    {% endfor %}
                    {% for error in editor.form.non_field_errors %}
                        <div>{{ error }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        </div>

        <div class="ui-name-editor__actions">
            <button
                type="button"
                class="btn btn-outline-secondary btn-sm"
                hx-get="{{ editor.display_url }}"
                hx-target="#{{ editor.dom_id }}"
                hx-swap="outerHTML"
            >
                Cancel
            </button>

            <button
                type="submit"
                class="btn btn-primary btn-sm"
            >
                Save
            </button>
        </div>
    </div>
</form>
