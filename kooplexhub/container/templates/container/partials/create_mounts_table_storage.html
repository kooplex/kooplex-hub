<div class="table-responsive create-volume-table-wrap">
  <table class="table table-sm table-hover align-middle mb-0">
    <thead>
      <tr>
        <th style="width: 5rem;">Attach</th>
        <th>Storage</th>
        <th>Description</th>
      </tr>
    </thead>

    <tbody>
      {% for volume in volumes %}
        <tr>
          <td>
            <input
              class="mount-toggle"
              type="checkbox"
              name="volume_ids"
              value="{{ volume.id }}"
              id="mount-volume-{{ volume.id }}"
              {% if volume.id in selected_volume_ids %}checked{% endif %}
            >
          </td>

          <td>
            <span class="mount-path-info" tabindex="0" title="{{ volume.mount_tooltip }}" aria-label="Mount details: {{ volume.mount_tooltip }}">
              <i class="bi bi-info-circle" aria-hidden="true"></i>
            </span>
            <label for="mount-volume-{{ volume.id }}" class="mb-0">
              {{ volume.folder }}
            </label>
          </td>

          <td>
            {{ volume.description|default:"" }}
          </td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="3" class="text-muted">
            No attachable storage volumes.
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
