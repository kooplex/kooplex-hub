<div class="mb-4">
  <h6 class="mb-1">
    Environment
  </h6>

  <p class="text-muted small mb-3">
    Choose a name and the software image
    used by the environment.
  </p>

  <div class="mb-3">
    <label
      for="container-create-name"
      class="form-label fw-semibold"
    >
      Name
    </label>

    <input
      id="container-create-name"
      class="form-control{% if form.name.errors %} is-invalid{% endif %}"
      type="text"
      name="name"
      minlength="3"
      required
      autocomplete="off"
      value="{{ form.name.value|default_if_none:'' }}"
      placeholder="e.g. analysis workspace"
    >

    {% if form.name.errors %}
      <div class="invalid-feedback d-block">
        {{ form.name.errors|striptags }}
      </div>
    {% else %}
      <div class="form-text">
        At least 3 characters.
      </div>
    {% endif %}
  </div>

  <div class="mb-3">
    {% include "ui/editors/image_picker/editor.html" with field=form.image only %}
  </div>

</div>
