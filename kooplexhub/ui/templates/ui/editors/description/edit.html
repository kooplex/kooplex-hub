<form
    id="{{ editor.dom_id }}"
    class="ui-description-editor"
    hx-post="{{ editor.update_url }}"
    hx-target="this"
    hx-swap="outerHTML"
>
    {% csrf_token %}

    <label
        for="{{ editor.field.id_for_label }}"
        class="visually-hidden"
    >
        {{ editor.field.label }}
    </label>

    {{ editor.field }}

    {% for error in editor.field.errors %}
        <div class="invalid-feedback d-block">
            {{ error }}
        </div>
    {% endfor %}

    {% for error in editor.form.non_field_errors %}
        <div class="invalid-feedback d-block">
            {{ error }}
        </div>
    {% endfor %}

    <div class="d-flex justify-content-end gap-2 mt-2">
        <button
            type="button"
            class="btn btn-outline-secondary btn-sm"
            hx-get="{{ editor.display_url }}"
            hx-target="#{{ editor.dom_id }}"
            hx-swap="outerHTML"
        >
            Cancel
        </button>

        <button type="submit" class="btn btn-primary btn-sm">
            Save
        </button>
    </div>
</form>
