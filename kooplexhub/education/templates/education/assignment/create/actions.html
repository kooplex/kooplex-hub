<div
    class="modal-footer"
    data-assignment-wizard-actions
>
    <button
        type="button"
        class="btn btn-outline-secondary me-auto"
        data-bs-dismiss="modal"
    >
        Cancel
    </button>

    <button
        type="button"
        class="btn btn-outline-secondary"
        data-assignment-wizard-previous
        hidden
    >
        Previous
    </button>

    <button
        type="button"
        class="btn btn-outline-primary"
        data-assignment-wizard-next
    >
        Scheduling
    </button>

    <button
        type="submit"
        class="btn btn-primary"
        name="creation_mode"
        value="assignment"
        data-assignment-create
        disabled
    >
        Create assignment
    </button>

    <button
        type="submit"
        class="btn btn-success"
        name="creation_mode"
        value="assignment_and_handout"
        data-assignment-create-handout
        disabled
    >
        Create and hand out now
    </button>
</div>
