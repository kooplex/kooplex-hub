<div id="container-volume-picker" class="create-picker">
  <div class="create-picker-header">
    <div>
      <h6 class="mb-1">Choose mounts</h6>
      <p class="text-muted small mb-0">
        Attach projects, courses, or storage volumes to this environment.
      </p>
    </div>

    {% if not embedded %}
    <button
      type="button"
      class="btn btn-sm btn-outline-secondary"
      hx-get="{% url 'container:create_picker_empty' %}"
      hx-target="#container-create-picker"
      hx-swap="innerHTML"
    >
      Close
    </button>
    {% endif %}
  </div>

  {% include "container/partials/mounts_picker_tabs.html" %}

  {% if not embedded %}
  <div class="create-picker-actions">
    <button
      type="button"
      class="btn btn-primary"
      hx-post="{% url 'container:create_mounts_selected' %}"
      hx-target="#container-create-mounts-slot"
      hx-swap="innerHTML"
      hx-include="#container-volume-picker, #container-create-form [name='csrfmiddlewaretoken']"
    >
      Use selected mounts
    </button>
  </div>
  {% endif %}
</div>
