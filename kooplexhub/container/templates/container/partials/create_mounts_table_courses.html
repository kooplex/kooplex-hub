<div class="table-responsive create-volume-table-wrap">
  <table class="table table-sm table-hover align-middle mb-0">
    <thead>
      <tr>
        <th style="width: 5rem;">Attach</th>
        <th>Course</th>
        <th>Role</th>
      </tr>
    </thead>

    <tbody>
      {% for course in courses %}
        <tr>
          <td>
            <input
              class="mount-toggle"
              type="checkbox"
              name="course_ids"
              value="{{ course.id }}"
              id="mount-course-{{ course.id }}"
              {% if course.id in selected_course_ids %}checked{% endif %}
            >
          </td>

          <td>
            <span class="mount-path-info" tabindex="0" title="{{ course.mount_tooltip }}" aria-label="Mount details: {{ course.mount_tooltip }}">
              <i class="bi bi-info-circle" aria-hidden="true"></i>
            </span>
            <label for="mount-course-{{ course.id }}" class="mb-0">
              {{ course.name }}
            </label>
          </td>

          <td>
            {% if course.mount_role_icon %}
              <span class="mount-course-role" title="{{ course.mount_role }}" aria-label="{{ course.mount_role }}" tabindex="0">
                <i class="bi {{ course.mount_role_icon }}" aria-hidden="true"></i>
              </span>
            {% else %}
              <span class="text-muted" aria-label="No course role">—</span>
            {% endif %}
          </td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="3" class="text-muted">
            No attachable courses.
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
