<div
  class="modal-footer project-create-wizard__actions"
  data-wizard-actions
>
  <button
    type="button"
    class="btn btn-outline-secondary me-auto"
    data-bs-dismiss="modal"
  >
    Cancel
  </button>

  <button
    type="button"
    class="btn btn-outline-secondary"
    data-wizard-previous
    hidden
  >
    Previous
  </button>

  <button
    type="button"
    class="btn btn-primary"
    data-wizard-next
  >
    Next
  </button>

  <button
    type="submit"
    class="btn btn-primary"
    name="creation_mode"
    value="project"
    data-wizard-create
    hidden
  >
    Create project
  </button>

  <button
    type="submit"
    class="btn btn-success"
    name="creation_mode"
    value="project_and_environment"
    data-wizard-create-environment
    hidden
  >
    Create project and environment
  </button>
</div>
