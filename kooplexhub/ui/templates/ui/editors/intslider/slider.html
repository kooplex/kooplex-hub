<div 
  class="ui-intslider{% if is_default %} ui-intslider--default{% endif %}" 
  data-ui-intslider
>
  <div class="ui-intslider__heading">
    {% if label %}
      <label
        for="{{ input_id }}"
        class="ui-intslider__label"
      >
        {{ label }}
      </label>
    {% endif %}

    <output
      id="{{ output_id }}"
      class="ui-intslider__value"
      for="{{ input_id }}"
    >
      {{ value }}{% if unit %} {{ unit }}{% endif %}
    </output>

    {% if allow_default %}
      <button
        type="button"
        class="btn btn-sm btn-link ui-intslider__default"
        data-ui-intslider-default
        title="{{ default_label|default:'Use default' }}"
        aria-label="{{ default_label|default:'Use default' }}"
      >
        <i class="bi bi-arrow-counterclockwise"></i>
      </button>

      <input
        type="hidden"
	name="{{ name }}_use_default"
        value="{% if is_default %}1{% else %}0{% endif %}"
        data-ui-intslider-default-flag
      >
    {% endif %}
  </div>

  <input
    id="{{ input_id }}"
    class="form-range ui-intslider__input"
    type="range"
    name="{{ name }}"
    min="{{ min }}"
    max="{{ max }}"
    step="{{ step }}"
    value="{{ value }}"
    data-ui-intslider-input
    data-output-id="{{ output_id }}"
    data-unit="{{ unit|default:'' }}"
    {% if role %}
      data-slider-role="{{ role }}"
    {% endif %}
  >

  <div class="ui-intslider__bounds">
    <span>
      {{ min }}{% if unit %} {{ unit }}{% endif %}
    </span>
    <span>
      {{ max }}{% if unit %} {{ unit }}{% endif %}
    </span>
  </div>
</div>
