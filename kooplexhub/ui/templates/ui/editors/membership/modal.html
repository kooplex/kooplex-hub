<div
    class="modal fade"
    id="{{ editor.dom_id }}-modal"
    tabindex="-1"
    aria-labelledby="{{ editor.dom_id }}-modal-title"
    aria-hidden="true"
    data-auto-show-modal
>
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <form
              id="{{ editor.dom_id }}-form"
              hx-post="{{ editor.update_url }}"
              hx-target="#{{ editor.dom_id }}-modal-content"
              hx-swap="innerHTML"
              data-membership-form
            >

                {% csrf_token %}

                <div
                  id="{{ editor.dom_id }}-modal-content"
                >

                <div class="modal-header">
                    <h2 
                        class="modal-title fs-5"
                        id="{{ editor.dom_id }}-modal-title"
                    >
                        Manage project members
                    </h2>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                    ></button>
                </div>

                <div class="modal-body">
                    {% include "ui/editors/membership/controls.html" with editor=editor membership_ui=membership_ui only %}
                </div>

                <div class="modal-footer">
                    <button
                        type="button"
                        class="btn btn-outline-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancel
                    </button>
            
                    <button
                        type="submit"
                        class="btn btn-primary"
                        data-membership-save
                        disabled
                    >
                        Save changes
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>
